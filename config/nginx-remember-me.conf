worker_processes 1;
pid /opt/var/run/nginx-remember-me.pid;
error_log /opt/var/log/nginx/error.log warn;

events {
    worker_connections 128;
}

http {
    default_type application/octet-stream;
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/x-icon                          ico;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/otf                              otf;
        application/wasm                      wasm;
        application/pdf                       pdf;
        text/plain                            txt;
        application/octet-stream              map;
    }

    access_log /opt/var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    server {
        listen 8080 default_server;
        server_name _;

        root /media/Data/www/remember-me;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
